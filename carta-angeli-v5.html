<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Angeli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#08070b;--paper:#efe6d6;--tulip:#d6334f;--gold:#d8b06a;--mist:#9a8fae;--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--hand:Caveat,cursive;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font:400 17px/1.6 var(--sans)}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#s{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}#s::-webkit-scrollbar{display:none}
.sc{height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 26px calc(env(safe-area-inset-bottom,0px) + 28px);overflow:hidden;background:radial-gradient(90% 60% at 50% var(--gy,100%),var(--g,#3a0f1c) 0%,transparent 70%),var(--ink)}
.k{font:500 .78rem var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.big{font:600 clamp(2.5rem,10vw,4.8rem)/1.02 var(--serif);margin:0 0 14px}
.lead{max-width:30em;font-size:1.12rem;color:#d9cfdf;margin:0 0 12px;white-space:pre-line}.mini{font-size:.82rem;color:var(--mist)}
.rv{opacity:0;transform:translateY(26px);filter:blur(7px);transition:opacity 1s,transform 1s,filter 1s;transition-delay:calc(var(--i,0)*150ms)}
.in .rv{opacity:1;transform:none;filter:none}
#nv{position:fixed;right:11px;top:50%;translate:0 -50%;z-index:6;display:flex;flex-direction:column;gap:11px}
#nv i{width:7px;height:7px;border-radius:50%;background:#ffffff33;cursor:pointer;transition:.4s}#nv i.on{background:var(--gold);transform:scale(1.6)}
.cue{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:.72rem;letter-spacing:.34em;color:var(--mist);animation:bob 2s ease-in-out infinite}@keyframes bob{50%{translate:0 8px}}
.btn{font:500 1rem var(--sans);color:var(--paper);background:#ffffff0d;border:1px solid var(--gold);border-radius:99px;padding:12px 28px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .3s,transform .2s}.btn:hover{background:#d8b06a33}.btn:active{transform:scale(.96)}
/* 1 portada */
.hero{justify-content:flex-start;padding-top:16svh;--g:#4a1223}
.hero h1{display:flex;overflow:hidden;margin:0 0 6px;font:600 clamp(4.2rem,24vw,10rem)/1 var(--serif);padding:.04em .06em}
.l{display:inline-block;transform:translateY(115%) rotate(9deg);transition:transform 1.2s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i)*100ms)}.in .l{transform:none}
.ht{position:absolute;bottom:-4px;left:50%;translate:-50% 0;height:min(46svh,380px);z-index:0}
.ht .stem{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.4s .7s cubic-bezier(.3,.7,.3,1)}.in .ht .stem{stroke-dashoffset:0}
.ht .lf,.ht .hd{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform 1.3s cubic-bezier(.3,1.5,.5,1)}
.in .ht .lf{transform:none;transition-delay:2s}.in .ht .hd{transform:none;transition-delay:2.7s}
/* 2 historia */
.ln{white-space:pre-line;font:italic 500 clamp(1.7rem,6.6vw,2.6rem)/1.25 var(--serif);margin:0 0 18px;opacity:0;filter:blur(9px);transform:translateX(calc(var(--d)*70px));transition:all 1.3s;transition-delay:calc(var(--i)*450ms + 300ms)}.in .ln{opacity:1;filter:none;transform:none}
.line{width:0;height:1px;background:var(--gold);margin:6px auto 22px;transition:width 1.6s .2s}.in .line{width:90px}
/* 3 fotos */
.fo{--g:#2b1838;--gy:30%}
.pols{position:relative;width:min(92vw,520px);height:min(56svh,440px);margin:10px 0}
.pol{position:absolute;width:min(40vw,180px);aspect-ratio:3/4.1;perspective:800px;cursor:pointer;transform:translateY(-130vh) rotate(calc(var(--r) + 40deg));transition:transform 1.5s cubic-bezier(.3,1.35,.5,1);transition-delay:calc(var(--i)*280ms)}
.in .pol{transform:rotate(var(--r))}
.fi{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s}.pol.fp .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;background:#f6f0e4;padding:9px 9px 0;box-shadow:0 18px 40px #000b;border-radius:3px;color:#2a2128}
.fb{transform:rotateY(180deg);display:grid;place-items:center;padding:12px;font:500 1.02rem/1.15 var(--hand);white-space:pre-line}
.im{width:100%;aspect-ratio:1;background:#222 center/cover;border-radius:2px}.ph{display:grid;place-items:center;background:linear-gradient(135deg,#3a2a40,#1c1422);color:#cdbfd6;font-size:.7rem}
.fa b{display:block;font:500 1.25rem var(--hand);padding:8px 2px}
/* 4 ojos */
.oj{--g:#2a0d18;--gy:50%}
.eyes{display:flex;gap:3vw;margin:6px 0 26px}
.eye{width:min(44vw,210px);border-radius:22px;overflow:hidden;transform:scaleY(0);transition:transform .9s cubic-bezier(.3,1.4,.5,1) .3s;box-shadow:0 10px 50px #d6334f44}.eye svg{display:block;width:100%}.eye:nth-child(2) svg{transform:scaleX(-1)}
.in .eye{transform:scaleY(1);animation:bl 5s 1.5s infinite}@keyframes bl{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.ir{transition:transform .12s}
/* 5 jardin */
.gd{--g:#10241a;--gy:100%;touch-action:manipulation}
.pt{position:absolute;translate:-50% -100%;transform-origin:50% 100%;animation:sp .9s cubic-bezier(.3,1.5,.5,1);pointer-events:none}@keyframes sp{from{transform:scale(0)}}
.pt svg{display:block;width:100%}.ok{opacity:0;transition:opacity 1s;color:var(--gold)}.ok.show{opacity:1}
/* 6 cuenta */
.cu{--g:#3b0e1c;--gy:60%}
.cd{display:flex;gap:10px;margin:18px 0 22px}.cd div{min-width:64px;padding:12px 8px;border:1px solid #d8b06a55;border-radius:12px;background:#ffffff08}
.cd b{display:block;font:600 2.2rem/1 var(--serif)}.cd small{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
/* 7 final */
.fin{--g:#4a1223;--gy:100%}
#ask{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:24px;min-height:60px}
.yes{background:var(--tulip);border-color:var(--tulip);color:#fff;padding:13px 36px}.yes:hover{background:#ef4763}
.no{transition:transform .28s cubic-bezier(.3,1.4,.5,1)}.hide{display:none!important}
#cat{position:fixed;right:16px;bottom:0;width:54px;z-index:7;border:0;background:none;padding:0;cursor:pointer;translate:0 12px;transition:translate .4s}#cat:hover{translate:0 0}
#cat .e{transform-box:fill-box;transform-origin:center;animation:cb 4.5s infinite}@keyframes cb{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#toast{position:fixed;left:50%;bottom:74px;translate:-50% 12px;max-width:min(86vw,360px);background:#0b0a0fee;border:1px solid var(--gold);border-radius:14px;padding:12px 16px;font-size:.92rem;text-align:center;opacity:0;transition:.4s;z-index:8;pointer-events:none}#toast.in{opacity:1;translate:-50% 0}
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:radial-gradient(80% 60% at 50% 70%,#4a1223,var(--ink));cursor:pointer;transition:opacity 1.3s}
#gate.gone{opacity:0;pointer-events:none}#gate h1{font:600 clamp(2.8rem,13vw,5rem)/1 var(--serif);margin:10px 0 4px}#gate p{color:var(--gold);letter-spacing:.2em;font-size:.82rem;text-transform:uppercase;animation:bob 2s ease-in-out infinite}#gate small{color:var(--mist);letter-spacing:.1em}
.gtu{height:110px}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:9;padding:7px 15px;font-size:.82rem}
.stamp{border:2px solid var(--tulip);color:var(--tulip);padding:3px 16px;letter-spacing:.34em;text-transform:uppercase;font-size:.72rem;rotate:-7deg;margin-bottom:12px;border-radius:4px}
.scr{position:relative;width:min(80vw,340px);height:118px;border-radius:14px;overflow:hidden;border:1px solid #d8b06a66;margin:6px 0 20px}
.dt{position:absolute;inset:0;display:grid;place-items:center;font:600 clamp(1.7rem,7vw,2.4rem) var(--serif);color:var(--paper);background:#140e18}
#sx{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.pol{touch-action:none;cursor:grab}
.eye.bk{animation:bk .6s!important}@keyframes bk{40%,60%{transform:scaleY(.07)}}.eye{cursor:pointer}
.note{width:min(90vw,520px);max-height:44svh;overflow:auto;background:radial-gradient(120% 90% at 20% 0%,#fbf5ea,var(--paper) 70%);color:#2a2128;border-radius:6px;padding:20px 24px;box-shadow:0 30px 70px #000c;outline:1px solid #b8914f88;outline-offset:-8px;cursor:pointer;scrollbar-width:none}.note::-webkit-scrollbar{display:none}
#lt{white-space:pre-wrap;text-align:left;font:500 1.34rem/1.4 var(--hand);min-height:6em}
.caret::after{content:"|";color:var(--tulip);animation:bl2 .7s steps(2) infinite}@keyframes bl2{50%{opacity:0}}
.fin .big{font-size:clamp(1.8rem,7vw,2.9rem);margin:16px 0 0}.fin .mini{margin:10px 0 0}
.ln,.hero h1,.big{translate:calc(var(--px,0)*16px) calc(var(--py,0)*10px)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>

<canvas id="cv"></canvas>
<div id="gate"><svg viewBox="0 0 60 200" class="gtu"><path d="M30 200C30 150 32 110 30 72" stroke="#4d7255" stroke-width="3" fill="none"/><path d="M30 176C8 166 6 140 14 120C27 132 31 154 30 176Z" fill="#37573f"/><path d="M30 74C11 72 7 44 12 28C20 37 26 35 30 24C34 35 40 37 48 28C53 44 49 72 30 74Z" fill="#d6334f"/></svg><h1>Para Angeli</h1><p>toca para empezar<br><small>con sonido</small></p></div><button class="btn" id="mu">♪ música</button><nav id="nv"></nav>
<main id="s">
<section class="sc hero"><h1 id="hn"></h1><p class="lead rv" style="--i:6" data-t="hero.sub"></p>
 <svg class="ht" viewBox="0 0 60 200"><path class="stem" pathLength="1" d="M30 200C30 150 32 110 30 72" stroke="#4d7255" stroke-width="3" fill="none" stroke-linecap="round"/><path class="lf" d="M30 176C8 166 6 140 14 120C27 132 31 154 30 176Z" fill="#37573f"/><g class="hd"><path d="M30 74C11 72 7 44 12 28C20 37 26 35 30 24C34 35 40 37 48 28C53 44 49 72 30 74Z" fill="#d6334f"/><path d="M30 74C21 62 22 40 30 24C38 40 39 62 30 74Z" fill="#fff" opacity=".22"/></g></svg>
 <div class="cue">DESLIZA ↓</div></section>
<section class="sc"><div class="k rv" data-t="historia.k"></div><div class="line"></div><div id="hl"></div></section>
<section class="sc fo"><div class="k rv" data-t="fotos.k"></div><h2 class="big rv" style="--i:1" data-t="fotos.t"></h2><div class="pols" id="pols"></div><p class="mini rv" data-t="fotos.hint"></p></section>
<section class="sc oj"><div class="k rv" data-t="ojos.k"></div><div class="eyes" id="eyes"></div><h2 class="big rv" style="--i:2" data-t="ojos.t"></h2><p class="lead rv" style="--i:3" data-t="ojos.l"></p></section>
<section class="sc gd" id="gd"><div class="k rv" data-t="jardin.k"></div><h2 class="big rv" style="--i:1" data-t="jardin.t"></h2><p class="lead rv" style="--i:2" data-t="jardin.l"></p><p class="lead ok" id="gok" data-t="jardin.ok"></p></section>
<section class="sc cu" id="mys"><div class="k rv" data-t="misterio.k"></div><div class="stamp rv" style="--i:1">confidencial</div><h2 class="big rv" style="--i:2" data-t="misterio.t"></h2><div class="scr rv" style="--i:3"><div class="dt" id="dt"></div><canvas id="sx"></canvas></div><p class="lead rv" style="--i:4" data-t="misterio.l"></p></section>
<section class="sc fin" id="fin"><div class="k rv" data-t="final.k"></div><div class="note rv" style="--i:1" id="note"><div id="lt"></div></div><p class="mini rv" style="--i:2">toca la carta para leerla completa</p><h2 class="big hide" id="fq" data-t="final.q"></h2><div id="ask" class="hide"><button class="btn yes" id="yes">Sí</button><button class="btn no" id="no">No</button></div></section>
</main>
<button id="cat" aria-label="Un gato"><svg viewBox="0 0 60 44"><path d="M4 44V10L17 21Q30 16 43 21L56 10V44Z" fill="#14111a" stroke="#ffffff40"/><ellipse class="e" cx="21" cy="30" rx="3.2" ry="4" fill="#d8b06a"/><ellipse class="e" cx="39" cy="30" rx="3.2" ry="4" fill="#d8b06a"/></svg></button><div id="toast"></div>

let tn=0;$("#gd").addEventListener("pointerdown",e=>{if(e.target.closest("button,a"))return;const g=$("#gd"),r=g.getBoundingClientRect(),d=document.createElement("div");d.className="pt";d.style.cssText="left:"+(e.clientX-r.left)+"px;top:"+(e.clientY-r.top)+"px;width:"+(34+Math.random()*28)+"px";d.innerHTML=T(C.colores[tn++%C.colores.length]);g.appendChild(d);navigator.vibrate&&navigator.vibrate(12);burst(5,e.clientX,e.clientY);if(tn===6)$("#gok").classList.add("show");if(tn>45)g.querySelector(".pt").remove()});

const no=$("#no");let nn=0,last=C.noTxt.length-1;

(function(){const c=$("#sx"),x=c.getContext("2d");$("#dt").textContent=C.misterio.fecha||C.misterio.pista;
const r0=c.getBoundingClientRect();c.width=r0.width||340;c.height=r0.height||118;const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,"#b8914f");g.addColorStop(.5,"#f1d79d");g.addColorStop(1,"#a67c3b");x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle="#3a2a10";x.font="500 13px DM Sans,sans-serif";x.textAlign="center";x.fillText("RASPA CON EL DEDO",c.width/2,c.height/2+5);

/* carta que se escribe sola, con sus tropiezos */
let lt0=0;const BS="\u0008",PZ="\u0001";
function typeLetter(){if(lt0)return;lt0=1;const L=$("#lt"),nt=$("#note"),ops=[],re=/\{([^|}]*)\|([^}]*)\}/g,s=C.final.carta;let i=0,m;
const add=x=>{for(const c of x)ops.push(c)};
while(m=re.exec(s)){add(s.slice(i,m.index)+m[1]);ops.push(PZ);for(let k=0;k<m[1].length;k++)ops.push(BS);add(m[2]);i=re.lastIndex}add(s.slice(i));
let k=0,txt="",sk=0;nt.addEventListener("click",()=>{sk=1});
const fin=()=>{L.classList.remove("caret");L.textContent=txt;nt.scrollTop=nt.scrollHeight;$("#fq").classList.remove("hide");$("#ask").classList.remove("hide")};

(function step(){if(sk){while(k<ops.length){const o=ops[k++];if(o===BS)txt=txt.slice(0,-1);else if(o!==PZ)txt+=o}return fin()}
if(k>=ops.length)return fin();
const o=ops[k++];let d=28+Math.random()*40;if(o===BS){txt=txt.slice(0,-1);d=60}else if(o===PZ)d=480;else{txt+=o;if(o==="\n")d=320;else if(o===","||o===":")d=170}
L.textContent=txt;nt.scrollTop=nt.scrollHeight;setTimeout(step,d)})()}
/* música: melodía original con aire de bachata */
let ac,mg,nb=0,nt0=0;const CH=[[57,60,64,69],[53,57,60,65],[48,52,55,60],[52,56,59,64]],ML=[76,72,74,71],BA=[45,41,36,40],AP=[0,2,1,3,2,1,3,2],mf=m=>440*Math.pow(2,(m-69)/12);
function pl(m,t,g,d,ty){const o=ac.createOscillator(),e=ac.createGain(),f=ac.createBiquadFilter();o.type=ty||"triangle";o.frequency.value=mf(m);f.type="lowpass";f.frequency.value=2600;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(e);e.connect(mg);o.start(t);o.stop(t+d+.05)}
function gu(t){const b=ac.createBuffer(1,2205,44100),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=ac.createBufferSource(),h=ac.createBiquadFilter(),e=ac.createGain();s.buffer=b;h.type="highpass";h.frequency.value=6500;e.gain.value=.05;s.connect(h);h.connect(e);e.connect(mg);s.start(t)}
function sched(){while(nt0<ac.currentTime+.5){const bar=Math.floor(nb/8)%4,k=nb%8,c=CH[bar];pl(c[AP[k]],nt0,.07,.9);if(k%4===0)pl(BA[bar],nt0,.12,.7,"sine");if(k===0)pl(ML[bar],nt0+.02,.05,2.2,"sine");if(k%2===1)gu(nt0);nt0+=.26;nb++}}
function startMusic(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.9;const cvb=ac.createConvolver(),n=ac.sampleRate*2,ib=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}cvb.buffer=ib;const wg=ac.createGain();wg.gain.value=.35;mg.connect(ac.destination);mg.connect(cvb);cvb.connect(wg);wg.connect(ac.destination);nt0=ac.currentTime+.1;setInterval(sched,120)}catch(e){}}

const cv=$("#cv"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion:reduce)").matches;let P=[];

if(!still)for(let i=0;i<28;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:0,vy:-.15-Math.random()*.2,r:1+Math.random()*1.6,a:0,va:0,c:"#d8b06a",l:Math.random(),g:0});
(function f(){cx.clearRect(0,0,innerWidth,innerHeight);for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;
 if(p.g){p.vy+=.09;p.vx*=.995;p.a+=p.va;p.l-=.0035;if(p.l<=0||p.y>innerHeight+30){P.splice(i,1);continue}cx.globalAlpha=Math.min(1,p.l*2)}
 else{p.l+=.01;cx.globalAlpha=.25+.35*Math.sin(p.l*3);if(p.y<-5){p.y=innerHeight+5;p.x=Math.random()*innerWidth}}
